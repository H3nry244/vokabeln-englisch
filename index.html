<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Englisch-Vokabeln lernen mit adaptiver Wiederholung.">
<title>Vokabeln · Englisch</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app">

    <!-- ================= ÜBERSICHT ================= -->
    <section class="screen" data-screen="start" aria-hidden="false">
        <header class="topbar">
            <div class="topbar__lead">
                <h1 class="topbar__title">Vokabeln</h1>
                <p class="topbar__subtitle">Englisch</p>
            </div>
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Erscheinungsbild wechseln"></button>
        </header>

        <div class="content">
            <section class="panel">
                <h2 class="panel__label">Thema</h2>
                <div class="topics" id="topic-list" role="radiogroup" aria-label="Thema"></div>
                <p class="loading" id="loading-note">Themen werden geladen …</p>
            </section>

            <section class="panel">
                <h2 class="panel__label">Richtung</h2>
                <div class="segmented" id="direction" role="radiogroup" aria-label="Abfragerichtung">
                    <button type="button" class="segmented__item" data-value="de-en" role="radio" aria-checked="true">Deutsch → Englisch</button>
                    <button type="button" class="segmented__item" data-value="en-de" role="radio" aria-checked="false">Englisch → Deutsch</button>
                </div>

                <h2 class="panel__label panel__label--spaced">Wiederholungen bis es sitzt</h2>
                <div class="segmented segmented--numbers" id="mastery" role="radiogroup" aria-label="Wiederholungen">
                    <button type="button" class="segmented__item" data-value="3" role="radio" aria-checked="false">3×</button>
                    <button type="button" class="segmented__item" data-value="5" role="radio" aria-checked="true">5×</button>
                    <button type="button" class="segmented__item" data-value="7" role="radio" aria-checked="false">7×</button>
                    <button type="button" class="segmented__item" data-value="10" role="radio" aria-checked="false">10×</button>
                </div>
                <p class="hint">Jedes Vokabel kommt so oft richtig beantwortet zurück, bis es als gelernt gilt.</p>
            </section>

            <button class="btn btn--primary" id="start-btn" type="button" disabled>Lernen starten</button>
            <button class="btn btn--plain" id="reset-btn" type="button">Fortschritt zurücksetzen</button>
        </div>
    </section>

    <!-- ================= LERNEN ================= -->
    <section class="screen" data-screen="study" aria-hidden="true">
        <header class="topbar topbar--study">
            <button class="icon-btn" id="study-back" type="button" aria-label="Zurück zur Übersicht">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <span class="topbar__center" id="study-topic">Thema</span>
            <span class="counter" id="study-counter">0/0</span>
        </header>
        <div class="progress"><div class="progress__bar" id="study-progress"></div></div>

        <div class="content content--study">
            <div class="card" id="card" aria-live="polite">
                <p class="card__hint" id="card-hint">Übersetze ins Englische</p>
                <p class="card__word" id="card-word"></p>

                <div class="field">
                    <input id="answer-input" type="text" placeholder="Antwort eingeben"
                           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                           enterkeyhint="done" aria-label="Deine Antwort">
                </div>

                <div class="feedback" id="feedback" hidden>
                    <span class="feedback__mark" id="feedback-mark" aria-hidden="true"></span>
                    <span class="feedback__text" id="feedback-text"></span>
                </div>
            </div>

            <div class="dots" id="dots" aria-label="Fortschritt dieses Vokabels"></div>

            <div class="actions">
                <button class="btn btn--primary" id="check-btn" type="button" disabled>Prüfen</button>
                <button class="btn btn--plain" id="skip-btn" type="button">Weiß ich nicht</button>
            </div>
        </div>
    </section>

    <!-- ================= ERGEBNIS ================= -->
    <section class="screen" data-screen="summary" aria-hidden="true">
        <div class="content content--summary">
            <p class="summary__eyebrow" id="summary-eyebrow">Runde abgeschlossen</p>
            <h2 class="summary__title" id="summary-title">Gut gemacht</h2>
            <p class="summary__subtitle" id="summary-subtitle"></p>

            <div class="stats" id="summary-stats"></div>

            <section class="panel panel--flush" id="summary-open-panel">
                <h2 class="panel__label" id="summary-open-label">Noch nicht sicher</h2>
                <ul class="wordlist" id="summary-open"></ul>
            </section>

            <button class="btn btn--primary" id="summary-continue" type="button">Weiter lernen</button>
            <button class="btn btn--plain" id="summary-home" type="button">Zur Übersicht</button>
        </div>
    </section>

</div>

<noscript>
    <p style="max-width:520px;margin:80px auto;font:16px/1.5 -apple-system,sans-serif;text-align:center">
        Diese Seite braucht JavaScript, um Vokabeln abzufragen.
    </p>
</noscript>

<script src="js/store.js"></script>
<script src="js/scheduler.js"></script>
<script src="js/app.js"></script>
</body>
</html>
