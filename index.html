<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Englisch Vokabeln</title>
    <style>
        /* --- CSS VARIABLES (Light Mode Default) --- */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --correct: #2ecc71;
            --incorrect: #e74c3c;
            --menu-bg: #ffffff;
            --shadow: rgba(0,0,0,0.05);
        }

        /* --- DARK MODE VARIABLES --- */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --primary: #5fa8ff;
            --primary-hover: #4A90E2;
            --menu-bg: #1e1e1e;
            --shadow: rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 20px;
            box-shadow: 0 2px 5px var(--shadow); position: sticky; top: 0; z-index: 100;
        }

        .menu-btn, .theme-btn {
            background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-color);
        }

        /* --- SIDEBAR MENU --- */
        #sidebar {
            position: fixed; top: 0; left: -250px; width: 250px; height: 100%;
            background: var(--menu-bg); box-shadow: 2px 0 5px var(--shadow);
            transition: 0.3s; z-index: 200; padding: 20px; overflow-y: auto;
        }
        #sidebar.open { left: 0; }
        #sidebar h2 { margin-bottom: 20px; font-size: 1.2rem; }
        .topic-btn {
            display: block; width: 100%; padding: 10px; margin-bottom: 10px;
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 5px; cursor: pointer; color: var(--text-color); text-align: left;
        }
        .topic-btn:hover { background: var(--border-color); }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; background: none; border: none; color: var(--text-color); cursor: pointer; }

        /* --- MAIN CONTENT --- */
        main { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        select {
            padding: 8px 12px; border-radius: 5px; border: 1px solid var(--border-color);
            background: var(--card-bg); color: var(--text-color); font-size: 1rem;
        }

        .vocab-card {
            background: var(--card-bg); padding: 20px; margin-bottom: 15px;
            border-radius: 10px; box-shadow: 0 4px 6px var(--shadow);
            border: 1px solid var(--border-color);
        }
        .vocab-question { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .vocab-input {
            width: 100%; padding: 10px; border: 1px solid var(--border-color);
            border-radius: 5px; background: var(--bg-color); color: var(--text-color); font-size: 1rem;
        }

        .btn-primary {
            display: block; width: 100%; padding: 15px; background: var(--primary);
            color: #fff; border: none; border-radius: 8px; font-size: 1.1rem;
            cursor: pointer; margin-top: 20px; transition: 0.2s;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .feedback { margin-top: 10px; font-weight: bold; display: none; }
        .correct-text { color: var(--correct); }
        .incorrect-text { color: var(--incorrect); }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <h3 id="current-topic-title">Laden...</h3>
        <button class="theme-btn" id="theme-toggle">Dark</button>
    </header>

    <div id="sidebar">
        <button class="close-btn" onclick="toggleMenu()">×</button>
        <h2>Themen</h2>
        <div id="topic-list"></div>
    </div>

    <main>
        <div class="controls">
            <select id="direction" onchange="renderQuiz()">
                <option value="en-de">Englisch ➔ Deutsch</option>
                <option value="de-en">Deutsch ➔ Englisch</option>
            </select>
            <button onclick="renderQuiz()" style="padding: 8px 12px; border-radius:5px; border:1px solid var(--border-color); background:var(--card-bg); color:var(--text-color); cursor:pointer;">Mischen</button>
        </div>

        <div id="quiz-container"></div>

        <button class="btn-primary" onclick="checkAnswers()">Prüfen</button>
    </main>

    <script>
        let currentVocab = [];
        let allTopics = [];

        // --- THEME LOGIC (Dark/Light Mode) ---
        const themeToggle = document.getElementById('theme-toggle');
        const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'dark' ? 'Light' : 'Dark';
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (prefersDarkScheme.matches) {
            setTheme('dark');
        } else {
            setTheme('light');
        }

        themeToggle.addEventListener('click', () => {
            let current = document.documentElement.getAttribute('data-theme');
            setTheme(current === 'dark' ? 'light' : 'dark');
        });


        // --- MENU & DATA FETCHING ---
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function initApp() {
            try {
                // Lade die Liste aller Kapitel
                const response = await fetch('data/topics.json');
                allTopics = await response.json();
                
                const topicList = document.getElementById('topic-list');
                topicList.innerHTML = '';
                
                allTopics.forEach(topic => {
                    const btn = document.createElement('button');
                    btn.className = 'topic-btn';
                    btn.textContent = topic.title;
                    btn.onclick = () => {
                        loadTopic(topic.id, topic.title);
                        toggleMenu();
                    };
                    topicList.appendChild(btn);
                });

                // Lade das erste Thema standardmäßig
                if(allTopics.length > 0) {
                    loadTopic(allTopics[0].id, allTopics[0].title);
                }
            } catch (error) {
                document.getElementById('current-topic-title').textContent = "Fehler beim Laden";
                console.error("Daten konnten nicht geladen werden. Läuft die Seite auf GitHub Pages?", error);
            }
        }

        async function loadTopic(id, title) {
            try {
                document.getElementById('current-topic-title').textContent = title;
                // Lade die Vokabeln für das spezifische Kapitel
                const response = await fetch(`data/${id}.json`);
                currentVocab = await response.json();
                renderQuiz();
            } catch (error) {
                console.error("Fehler beim Laden der Vokabeln.", error);
            }
        }

        // --- QUIZ LOGIC ---
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            
            // Array mischen
            let shuffled = [...currentVocab].sort(() => Math.random() - 0.5);
            const direction = document.getElementById('direction').value;

            shuffled.forEach((word, index) => {
                const isEnToDe = direction === 'en-de';
                const question = isEnToDe ? word.en : word.de;
                const answer = isEnToDe ? word.de : word.en;

                const card = document.createElement('div');
                card.className = 'vocab-card';
                card.innerHTML = `
                    <div class="vocab-question">${question}</div>
                    <input type="text" class="vocab-input" id="input-${index}" autocomplete="off" placeholder="Übersetzung eingeben...">
                    <input type="hidden" id="answer-${index}" value="${answer}">
                    <div class="feedback" id="feedback-${index}"></div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('.vocab-input');
            inputs.forEach((input, index) => {
                const userAnswer = input.value.trim().toLowerCase();
                // Schneidet beim Überprüfen Synonyme nach dem Komma oder Schrägstrich ab
                const correctAnswerFull = document.getElementById(`answer-${index}`).value;
                const correctAnswerMain = correctAnswerFull.split(/[,/]/)[0].trim().toLowerCase();
                const feedback = document.getElementById(`feedback-${index}`);

                feedback.style.display = 'block';

                if (userAnswer === correctAnswerMain || userAnswer === correctAnswerFull.toLowerCase()) {
                    feedback.textContent = 'Richtig!';
                    feedback.className = 'feedback correct-text';
                    input.style.borderColor = 'var(--correct)';
                } else {
                    feedback.textContent = `Falsch! Lösung: ${correctAnswerFull}`;
                    feedback.className = 'feedback incorrect-text';
                    input.style.borderColor = 'var(--incorrect)';
                }
            });
        }

        // Start App
        initApp();
    </script>
</body>
</html>
